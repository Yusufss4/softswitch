name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: # dry run: builds packages and docs without publishing

permissions:
  contents: read

jobs:
  package:
    name: package (bookworm, ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git ca-certificates file \
            cmake ninja-build pkg-config libgtest-dev libgmock-dev libpcap-dev libnl-3-dev libnl-route-3-dev
      - uses: actions/checkout@v7
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^  VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt)
          echo "CMake version: $version, tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build and test
        run: |
          cmake --preset release -DSOFTSWITCH_BUILD_BENCHMARKS=OFF
          cmake --build --preset release
          ctest --preset release
      - name: Package (.deb + .tar.gz)
        run: |
          cd build/release && cpack
          for f in softswitch-*-Linux.tar.gz; do mv "$f" "${f%-Linux.tar.gz}-linux-${{ matrix.arch }}.tar.gz"; done
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: |
            build/release/softswitch_*.deb
            build/release/softswitch-*.tar.gz

  docs:
    name: docs (doxygen)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ doxygen graphviz
      - name: Generate API docs
        run: |
          cmake --preset release -DSOFTSWITCH_BUILD_TESTS=OFF -DSOFTSWITCH_BUILD_BENCHMARKS=OFF
          cmake --build build/release --target docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/release/docs/html

  publish:
    name: publish GitHub release (dry run on manual dispatch)
    needs: [package, docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^  VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt)"
          fi
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      # syft runs from its container image (Docker Hub) instead of anchore/sbom-action, which
      # downloads syft from GitHub Releases on every run: those downloads returned HTTP 504 for
      # hours and blocked the v1.0.0 release. One retry covers a registry hiccup.
      - name: Generate SBOM (SPDX)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          SYFT_IMAGE: anchore/syft:v1.42.3
        run: |
          for attempt in 1 2; do
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src:ro" -v "$PWD/dist:/out" \
              "$SYFT_IMAGE" scan dir:/src -q -o "spdx-json=/out/softswitch-$TAG.spdx.json" && break
            [[ $attempt == 2 ]] && exit 1
            echo "::warning::syft failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          jq -r '"\(.spdxVersion), \(.packages | length) packages"' "dist/softswitch-$TAG.spdx.json"
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          version="${TAG#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::No CHANGELOG section for $version"; exit 1; }
          {
            echo
            echo "### Install on Raspberry Pi OS / Debian bookworm (arm64)"
            echo '```sh'
            echo "sudo apt install ./softswitch_${version}_arm64.deb"
            echo '```'
            echo "Verify downloads with \`sha256sum -c SHA256SUMS\`."
          } >> notes.md
          cat notes.md
      - name: Upload dry-run release bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            dist/
            notes.md
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "softswitch $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  deploy-docs:
    name: deploy docs to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
