! sw3: 8-switch demo topology; hosts h4 (VLAN 20); trunks to sw2, sw4, sw7.
hostname sw3
trace sample 1
vlan 10 name users
vlan 20 name servers
interface s3p1 description host h4
interface s3p1 spanning-tree portfast
interface s3p1 switchport access vlan 20
interface s3p2 description peer sw2 s2p3
interface s3p2 switchport mode trunk
interface s3p2 switchport trunk allowed vlan 10,20
interface s3p3 description peer sw4 s4p2
interface s3p3 switchport mode trunk
interface s3p3 switchport trunk allowed vlan 10,20
interface s3p4 description peer sw7 s7p4
interface s3p4 switchport mode trunk
interface s3p4 switchport trunk allowed vlan 10,20
