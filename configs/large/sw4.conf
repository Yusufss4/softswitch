! sw4: 8-switch demo topology; hosts h5 (VLAN 10); trunks to sw3, sw5.
hostname sw4
trace sample 1
vlan 10 name users
vlan 20 name servers
interface s4p1 description host h5
interface s4p1 spanning-tree portfast
interface s4p1 switchport access vlan 10
interface s4p2 description peer sw3 s3p3
interface s4p2 switchport mode trunk
interface s4p2 switchport trunk allowed vlan 10,20
interface s4p3 description peer sw5 s5p2
interface s4p3 switchport mode trunk
interface s4p3 switchport trunk allowed vlan 10,20
