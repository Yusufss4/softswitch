! sw2: 8-switch demo topology; hosts h3 (VLAN 10); trunks to sw1, sw3.
hostname sw2
trace sample 1
vlan 10 name users
vlan 20 name servers
interface s2p1 description host h3
interface s2p1 spanning-tree portfast
interface s2p1 switchport access vlan 10
interface s2p2 description peer sw1 s1p3
interface s2p2 switchport mode trunk
interface s2p2 switchport trunk allowed vlan 10,20
interface s2p3 description peer sw3 s3p2
interface s2p3 switchport mode trunk
interface s2p3 switchport trunk allowed vlan 10,20
