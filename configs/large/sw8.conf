! sw8: 8-switch demo topology; hosts h9 (VLAN 10); trunks to sw7, sw1.
hostname sw8
trace sample 1
vlan 10 name users
vlan 20 name servers
interface s8p1 description host h9
interface s8p1 spanning-tree portfast
interface s8p1 switchport access vlan 10
interface s8p2 description peer sw7 s7p3
interface s8p2 switchport mode trunk
interface s8p2 switchport trunk allowed vlan 10,20
interface s8p3 description peer sw1 s1p4
interface s8p3 switchport mode trunk
interface s8p3 switchport trunk allowed vlan 10,20
