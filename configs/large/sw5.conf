! sw5: 8-switch demo topology; hosts h6 (VLAN 20); trunks to sw4, sw6, sw1.
hostname sw5
trace sample 1
vlan 10 name users
vlan 20 name servers
interface s5p1 description host h6
interface s5p1 spanning-tree portfast
interface s5p1 switchport access vlan 20
interface s5p2 description peer sw4 s4p3
interface s5p2 switchport mode trunk
interface s5p2 switchport trunk allowed vlan 10,20
interface s5p3 description peer sw6 s6p2
interface s5p3 switchport mode trunk
interface s5p3 switchport trunk allowed vlan 10,20
interface s5p4 description peer sw1 s1p5
interface s5p4 switchport mode trunk
interface s5p4 switchport trunk allowed vlan 10,20
