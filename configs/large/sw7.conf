! sw7: 8-switch demo topology; hosts h8 (VLAN 20); trunks to sw6, sw8, sw3.
hostname sw7
trace sample 1
vlan 10 name users
vlan 20 name servers
interface s7p1 description host h8
interface s7p1 spanning-tree portfast
interface s7p1 switchport access vlan 20
interface s7p2 description peer sw6 s6p3
interface s7p2 switchport mode trunk
interface s7p2 switchport trunk allowed vlan 10,20
interface s7p3 description peer sw8 s8p2
interface s7p3 switchport mode trunk
interface s7p3 switchport trunk allowed vlan 10,20
interface s7p4 description peer sw3 s3p4
interface s7p4 switchport mode trunk
interface s7p4 switchport trunk allowed vlan 10,20
