! sw6: 8-switch demo topology; hosts h7 (VLAN 10); trunks to sw5, sw7.
hostname sw6
trace sample 1
vlan 10 name users
vlan 20 name servers
interface s6p1 description host h7
interface s6p1 spanning-tree portfast
interface s6p1 switchport access vlan 10
interface s6p2 description peer sw5 s5p3
interface s6p2 switchport mode trunk
interface s6p2 switchport trunk allowed vlan 10,20
interface s6p3 description peer sw7 s7p2
interface s6p3 switchport mode trunk
interface s6p3 switchport trunk allowed vlan 10,20
