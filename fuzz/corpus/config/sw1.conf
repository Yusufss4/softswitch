! sw1: core switch with hosts h1 (VLAN 10) and h2 (VLAN 20); trunks to sw2 and sw3.
hostname sw1
vlan 10 name users
vlan 20 name servers
interface s1p1 description host h1
interface s1p1 switchport access vlan 10
interface s1p2 description host h2
interface s1p2 switchport access vlan 20
interface s1p3 description peer sw2 s2p2
interface s1p3 switchport mode trunk
interface s1p3 switchport trunk allowed vlan 10,20
interface s1p4 description peer sw3 s3p3
interface s1p4 switchport mode trunk
interface s1p4 switchport trunk allowed vlan 10,20
